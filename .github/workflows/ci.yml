name: CI

on:
  push:
    branches: [ master, dotnetcore ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Building the solution in Release enforces the analyzer quality gate on
      # the shipped library (EnableNETAnalyzers + TreatWarningsAsErrors), so a
      # CA violation fails the build.
      - name: Build
        run: dotnet build AtomEventStore.sln -c Release

      # Runs every test project. The Azure integration tests skip automatically
      # unless the repository defines the ATOMEVENTSTORE_AZURE_CONNECTION secret
      # (a test-account connection string); they never fail merely for being
      # unconfigured.
      - name: Test
        env:
          ATOMEVENTSTORE_AZURE_CONNECTION: ${{ secrets.ATOMEVENTSTORE_AZURE_CONNECTION }}
        run: dotnet test AtomEventStore.sln -c Release --no-build

      - name: Pack
        run: dotnet pack AtomEventStore/AtomEventStore.csproj -c Release -o ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
